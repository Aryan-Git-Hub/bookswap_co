  <h2 class="mb-5 text-center">Choose Address</h2>
  <div class="row d-flex justify-content-center mb-2" id="address-cards">
      {% for address in addresses %}
      <label for="id_selected_id_{{ forloop.counter }}" class="col-md-4 col-sm-6 col-12 mb-4">
          <div class="card">
              <div class="card-body">
                  <div class="d-flex justify-content-between align-items-center">
                      <h5 class="card-title">
                          <i class="fas fa-map-marker-alt"></i> Address {{ forloop.counter }}
                      </h5>
                      <input
                          class="form-check-input"
                          type="radio"
                          name="selected_address_id"
                          id="id_selected_id_{{ forloop.counter }}"
                          value="{{ address.id }}"
                      />
                  </div>
                  <hr class="my-2" />
                  <p class="card-text">
                      <p class="mb-2"><i class="fas fa-user userIcon orange-2"></i> <strong>{{ address.full_name }}</strong></p> 
                      <p><span class="">{{address.full_address|truncatechars:28}}</span></p>
                      <p><!--i class="fas fa-city text-primary"></i--> {{ address.city }}, {{address.state}}  </p> 
                      <p class=" d-flex justify-content-end"> <span class="text-black category-badge" title="pin code" style="padding: 0.2rem 0.5rem;  border: 1px solid #000; border-radius:1rem; font-size: 0.8rem;"><i class="fas fa-envelope me-1"></i> {{address.pincode}}</span> </p>
                      <p class="mt-2"><i class="fas fa-phone phoneIcon ornage-2"></i> <strong> {{ address.mobile }}</strong></p>
                  </p>
                  <div class="d-flex justify-content-between pt-1">
                      <a href="/accounts/address/{{ address.id }}/" class="btn theme-btn-deep btn-sm col-12 me-1">
                          <i class="fas fa-edit"></i> Edit
                      </a>
                  </div>
              </div>
          </div>
        </label>
      {% endfor %}

      <label class="col-md-4 col-sm-6 col-12 mb-4 card address-card">
          <h5 class="text-center pt-3" class="card-title">Add New Address</h5>
          <hr class="my-2" />
          <a href="/accounts/address/0/" class="">
              <div>
                  <i class="fas fa-plus-circle add-icon"></i>
              </div>
          </a>
        </label>
    </div>
