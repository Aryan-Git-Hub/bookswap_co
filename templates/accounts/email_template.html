<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px 5px 0 0;
        }
        .content {
            margin: 20px 0;
            color: #333333;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-top: 20px;
        }
        .logo_img {
            height: 50px;
        }
    </style>
</head>
<body>
    {% load static %}
    <div class="email-container">
        <img src="cid:logo" alt="" class="logo_img">
        <div class="header">
            <h1>Welcome to BookSwap</h1>
        </div>
        <div class="content">
            <p>Hi {{ username }},</p>
            <p>Your OTP is {{ otp }},</p>
            <p>We're excited to have you on board. Thank you for joining!</p>
        </div>
        <div class="footer">
            <p>&copy; 2025 MyWebsite. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
