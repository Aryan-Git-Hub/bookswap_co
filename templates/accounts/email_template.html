<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookSwap OTP</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Handjet:wght@100..900&family=Nosifer&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=SUSE:wght@100..800&display=swap");
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .email-container {
        max-width: 600px;
        margin: 20px auto;
        background-color: #ffffff;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-family: "Nunito Sans";
      }
      .header {
        text-align: center;
        padding: 20px;
        background-color: #ff9800;
        color: white;
        border-radius: 5px 5px 0 0;
      }
      .header img {
        max-width: 100px;
        height: auto;
      }
      .header h1 {
        margin: 10px 0;
        font-size: 24px;
        font-family: "Poppins";
      }
      .content {
        text-align: center;
        margin: 20px 0;
        color: #333333;
      }
      .otp {
        font-size: 24px;
        font-weight: bold;
        color: #ff9800;
        margin: 10px 0;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #888888;
        margin-top: 20px;
        font-family: "SUSE";
      }
      .logo_img {
        height: 50px;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <!-- Header with logo and orange box -->
      <div class="header">
        <img src="cid:logo" alt="BookSwap Logo" height="50" width="50" />
        <h1>Welcome to BookSwap</h1>
      </div>
      <!-- Content with OTP -->
      <div class="content">
        <p>Hi {{ username }},</p>
        <p>Your OTP is:</p>
        <p class="otp">{{ otp }}</p>
        <p>
          Enter this code on our website to proceed. The OTP is valid for 10
          minutes.
        </p>
        <p>
          Thank you for joining BookSwap! We're thrilled to have you here.
        </p>
      </div>
      <!-- Footer -->
      <div class="footer">
        <p style="color: #555">
          If you didn't request this email, please ignore it.
        </p>
        <p>&copy; 2025 BookSwap. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
