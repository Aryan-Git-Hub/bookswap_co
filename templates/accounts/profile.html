{% extends "base.html" %} {% block content %}
{% include "sticky_messages_alert.html" %}


<div class="container border my-5 d-flex">
  <form method="POST" class="border justify-content-center align-items-center" style="width: 100%;">
    {% csrf_token %}
    <div class="row my-2">
      <div class="form-group col-4">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
      </div>
      <div class="form-group col-8">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
      </div>
    </div>

    <div class="row my-2">
      <div class="form-group col-12">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
      </div>
    </div>
  </form>
</div>

{% endblock content %}
