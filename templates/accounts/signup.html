{% extends "base.html" %} {% block content %}

<div class="min-vh-100 d-flex flex-column justify-content-center align-items-center">

<div
  class="container-box d-flex flex-column justify-content-center align-items-center"
>
  <h2 class="text-center mb-4">Welcome to Bookswap 📚</h2>
  <form method="POST" class="needs-validation" novalidate>
    {% csrf_token %} {% for field in form %}
    <div class="formFloat">
      {{field}}
      <label class="form-label" for="{{field.id}}">{{field.label}}</label>
      <div class="feedback" style="color: red">{{field.errors.as_text}}</div>
    </div>
    {% endfor %}
    <div class="col-12 mt-3">
      <button class="btn btn-primary offset-md-3 col-md-6 col-sm-12" type="submit">Register</button>
    </div>
  </form>
</div>

</div>
{% endblock content %}
{% block js %}
{% include "sticky_messages_alert.html" %}
{% endblock js %}
