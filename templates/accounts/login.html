{% extends "base.html" %} {% block content %}





<div
  class="container d-flex flex-column justify-content-center align-items-center min-vh-100"
>
  <h2 class="text-center mb-2">Login</h2>
  <form method="POST" class="needs-validation" novalidate>
    {% csrf_token %} {% for field in form %}
    <div class="mt-2">
      <label class="form-label">{{field.label}}</label>
      {{field}}
      <div class="feedback" style="color: red">{{field.errors.as_text}}</div>
    </div>
    {% endfor %}
    <div class="mt-4">
      <button class="btn btn-primary d-block col-12" type="submit">Submit</button>
      <a href="{% url "change_pass" %}" class="d-block mt-2 text-start text-decoration-none">Forgot Password?</a>
    </div>
  </form>
</div>
{% endblock content %}
{% block js %}
{% include "sticky_messages_alert.html" %}
{% endblock js %}
