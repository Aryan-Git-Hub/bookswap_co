{% extends "base.html" %}
{% block content %}

{% include "sticky_messages_alert.html" %}

    <div class="container d-flex flex-column gap-5 justify-content-center align-items-center" style="min-height: 90vh;">
        <h2>Post Ad</h2>
        <form class="needs-validation row" method="POST" novalidate enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            {% if not field.is_hidden %}
                <div class="col-12 col-lg-4">
                <label class="form-label">{{field.label}}</label>
                {{field}}
                <div class="feedback" style="color: red">{{field.errors.as_text}}</div>
                </div>
            {% endif %}
            {% endfor %}
            {{form.seller}}
            <div class="col-12 col-lg-4 d-flex justify-content-center align-items-center mt-3 mt-lg-0">
                <button class="btn btn-info form-control" type="submit">POST</button>
            </div>
        </form>

    </div>

{% endblock content %}
