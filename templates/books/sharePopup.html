{% extends "base.html" %}

{% block css %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    .sharePopup {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        padding: 20px;
        background-color: #f8f9fa;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: 20px auto;
    }
    a {
        text-decoration: none;
    }
    .sharePopup .social-item {
        margin: 10px;
        text-align: center;
        flex: 1 0 30%;
    }
    .sharePopup .social-item i {
        font-size: 2rem;
        color: #007bff;
        transition: transform 0.2s, color 0.2s;
    }
    .sharePopup .social-item:hover i {
        transform: scale(1.2);
        color: #0056b3;
    }
    .sharePopup .social-item span {
        display: block;
        margin-top: 8px;
        font-size: 0.9rem;
        color: #212529;
    }
</style>
{% endblock css %}

{% block share %}
<section class="sharePopup">
    <div class="social-item">
        <a href="https://wa.me/?text=Check%20this%20out!" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp</span>
        </a>
    </div>
    <div class="social-item">
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a>
    </div>
    <div class="social-item">
        <a href="https://www.facebook.com/sharer/sharer.php" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook"></i>
            <span>Facebook</span>
        </a>
    </div>
    <div class="social-item">
        <a href="https://twitter.com/intent/tweet" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-x-twitter"></i>
            <span>X</span>
        </a>
    </div>
    <div class="social-item">
        <a href="https://www.threads.net" target="_blank" rel="noopener noreferrer">
            <i class="fa fa-threads"></i>
            <span>Threads</span>
        </a>
    </div>
    <div class="social-item">
        <a href="https://www.snapchat.com" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-snapchat"></i>
            <span>Snapchat</span>
        </a>
    </div>
</section>
{% endblock share %}

{% block js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
{% endblock js %}
