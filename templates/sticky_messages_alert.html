<script>
  const Toast = Swal.mixin({
    toast: true,
    position: "top",
    showConfirmButton: false,
    timer: 5000,
    timerProgressBar: true,
    didOpen: (toast) => {
      toast.onmouseenter = Swal.stopTimer;
      toast.onmouseleave = Swal.resumeTimer;
    }
  });
</script>

{% for message in messages %}
<script>
  Toast.fire({
    icon: "{{message.tags}}",
    title: "{{message}}"
  });
</script>
{% endfor %}
